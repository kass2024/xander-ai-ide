# HTTP bootstrap — use until SSL certs exist (see scripts/setup-ssl-parrotmoc.sh)
events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 128;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # API — api.parrotmoc.online
    server {
        listen 80;
        server_name api.parrotmoc.online;

        client_max_body_size 20m;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /billing/webhook {
            proxy_pass http://backend:3001/billing/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
        }

        location / {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Web — parrotmoc.online + www
    server {
        listen 80;
        server_name parrotmoc.online www.parrotmoc.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /_next/static {
            proxy_pass http://web:3000;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
