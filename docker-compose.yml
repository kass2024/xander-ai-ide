services:
  postgres:
    image: postgres:16
    container_name: xander_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xander_ai_ide
    ports:
      - "5432:5432"
    volumes:
      - xander_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: xander_redis
    restart: always
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: xander_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - xander_qdrant_data:/qdrant/storage

volumes:
  xander_postgres_data:
  xander_qdrant_data: