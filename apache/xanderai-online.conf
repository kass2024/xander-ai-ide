# Apache vhosts for Xander AI IDE — proxy to Docker Nginx on 127.0.0.1:8088
# ONLY xanderai.online / api.xanderai.online — does NOT affect parrotcanada.site etc.
#
# Install: sudo cp apache/xanderai-online.conf /etc/apache2/sites-available/
#          sudo a2ensite xanderai-online.conf && sudo systemctl reload apache2

# --- HTTP: ACME challenges + redirect to HTTPS ---
<VirtualHost *:80>
    ServerName xanderai.online
    ServerAlias www.xanderai.online api.xanderai.online

    DocumentRoot /var/www/html

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/xanderai-http-error.log
    CustomLog ${APACHE_LOG_DIR}/xanderai-http-access.log combined
</VirtualHost>

# --- HTTPS: Web (xanderai.online) ---
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName xanderai.online

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/xanderai.online/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/xanderai.online/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:8088/
    ProxyPassReverse / http://127.0.0.1:8088/

    ErrorLog ${APACHE_LOG_DIR}/xanderai-online-error.log
    CustomLog ${APACHE_LOG_DIR}/xanderai-online-access.log combined
</VirtualHost>

# --- HTTPS: www → apex ---
<VirtualHost *:443>
    ServerName www.xanderai.online

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/xanderai.online/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/xanderai.online/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    Redirect permanent / https://xanderai.online/
</VirtualHost>

# --- HTTPS: API (api.xanderai.online) ---
<VirtualHost *:443>
    ServerName api.xanderai.online

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/xanderai.online/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/xanderai.online/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Stripe webhook — no buffering
    ProxyPass        /billing/webhook http://127.0.0.1:8088/billing/webhook disablereuse=On
    ProxyPassReverse /billing/webhook http://127.0.0.1:8088/billing/webhook

    ProxyPass        / http://127.0.0.1:8088/
    ProxyPassReverse / http://127.0.0.1:8088/

    LimitRequestBody 20971520

    ErrorLog ${APACHE_LOG_DIR}/xanderai-api-error.log
    CustomLog ${APACHE_LOG_DIR}/xanderai-api-access.log combined
</VirtualHost>
</IfModule>
