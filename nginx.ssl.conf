# HTTPS production — enabled after Let's Encrypt (scripts/setup-ssl.sh)
events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 128;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Modern TLS (no dependency on certbot options-ssl-nginx.conf)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HTTP → HTTPS
    server {
        listen 80;
        server_name xanderai.online www.xanderai.online api.xanderai.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # API — https://api.xanderai.online
    server {
        listen 443 ssl;
        http2 on;
        server_name api.xanderai.online;

        ssl_certificate /etc/letsencrypt/live/xanderai.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xanderai.online/privkey.pem;

        client_max_body_size 20m;

        location /billing/webhook {
            proxy_pass http://backend:3001/billing/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
        }

        location / {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Web — https://xanderai.online
    server {
        listen 443 ssl;
        http2 on;
        server_name xanderai.online;

        ssl_certificate /etc/letsencrypt/live/xanderai.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xanderai.online/privkey.pem;

        location = /api-health {
            proxy_pass http://backend:3001/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        location /_next/static {
            proxy_pass http://web:3000;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # www → apex
    server {
        listen 443 ssl;
        http2 on;
        server_name www.xanderai.online;

        ssl_certificate /etc/letsencrypt/live/xanderai.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xanderai.online/privkey.pem;

        return 301 https://xanderai.online$request_uri;
    }
}
